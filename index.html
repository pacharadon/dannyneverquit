/* ERROR BOUNDARY */
class ErrorBoundary extends Component {
  constructor(p) { super(p); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error(error, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div className="p-8 min-h-screen bg-red-950 text-red-200 flex flex-col items-center">
          <AlertCircle size={48} className="mb-4" />
          <h1 className="text-2xl font-bold mb-2">Something went wrong</h1>
          <pre className="bg-black/30 p-4 rounded border text-xs max-w-2xl overflow-auto">{String(this.state.error)}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

/* =========================================================

   ========================================================= */
const splitSteps = (text) => {
  if (!text) return [];
  const lines = text.split('\n');
  const out = [];
  let cur = null;
  for (const line of lines) {
    const m = line.match(/^# Step (\d+):\s*(.*)$/);
    if (m) { if (cur) out.push(cur); cur = { n: m[1], title: m[2], body: [] }; }
    else if (cur) cur.body.push(line);
  }
  if (cur) out.push(cur);
  return out.map(s => ({ ...s, body: s.body.join('\n').replace(/^\n+|\n+$/g, '') }));
};
const PythonGuide = ({ pythonText, dfHint }) => {
  const steps = useMemo(() => splitSteps(pythonText), [pythonText]);
  return (
    <div className="space-y-2">
      {steps.map((s, i) => (
        <div key={i} className="bg-emerald-950/60 border border-emerald-800 rounded-lg overflow-hidden">
          <div className="bg-emerald-900/50 px-3 py-1.5 flex items-center gap-2 border-b border-emerald-800">
            <div className="w-5 h-5 rounded-full bg-emerald-500 text-emerald-950 text-[10px] font-black flex items-center justify-center">#{s.n}</div>
            <span className="text-[11px] font-bold text-emerald-100">{s.title || `Step ${s.n}`}</span>
          </div>
          <pre className="px-4 py-3 font-mono text-[12px] leading-relaxed text-emerald-100 whitespace-pre-wrap">{s.body}</pre>
        </div>
      ))}
      {dfHint && (
        <div className="pt-1 text-[10px] text-emerald-400/80">
          Assumes <code className="text-emerald-200">{dfHint}</code> are pre-loaded as DataFrames.
        </div>
      )}
    </div>
  );
};

/* =========================================================
   VENN DIAGRAM (for join flashcards)
   ========================================================= */
const VennDiagram = ({ highlight }) => {
  const leftFill  = ['left_all','left_exclusion','full'].includes(highlight) ? '#3b82f6' : 'transparent';
  const rightFill = ['right_all','full'].includes(highlight) ? '#3b82f6' : 'transparent';
  const showIntersect = highlight === 'intersect';
  const cutoutRight = highlight === 'left_exclusion';
  return (
    <div className="flex flex-col items-center py-4">
      <svg width="220" height="150" viewBox="0 0 220 150">
        <defs><clipPath id="rc"><circle cx="135" cy="75" r="60" /></clipPath></defs>
        <circle cx="80" cy="75" r="60" fill={leftFill} fillOpacity="0.85" stroke="#475569" strokeWidth="2" />
        <circle cx="135" cy="75" r="60" fill={rightFill} fillOpacity="0.85" stroke="#475569" strokeWidth="2" />
        {showIntersect && <circle cx="80" cy="75" r="60" fill="#3b82f6" fillOpacity="0.9" clipPath="url(#rc)" />}
        {cutoutRight && <circle cx="135" cy="75" r="60" fill="#0f172a" stroke="#475569" strokeWidth="2" />}
        <text x="55" y="82" fontSize="20" fontWeight="900" fill={leftFill !== 'transparent' ? 'white' : '#94a3b8'}>A</text>
        <text x="148" y="82" fontSize="20" fontWeight="900" fill={rightFill !== 'transparent' ? 'white' : '#94a3b8'}>B</text>
      </svg>
      <div className="mt-2 px-3 py-1 bg-orange-500/20 border border-orange-500/40 text-orange-300 rounded-md text-[9px] font-black uppercase tracking-widest">
        {highlight ? highlight.replace(/_/g, ' ') : 'cartesian'}
      </div>
    </div>
  );
};

        </div>
      </aside>

      <main className="flex-1 overflow-y-auto bg-slate-950">
        <div className="max-w-5xl mx-auto p-6 space-y-5">
          <header className={`${tone.bg} border ${tone.ring} rounded-xl p-5`}>
            <div className="flex items-center gap-2 mb-1">
              <span className={tone.text}>{role.icon}</span>
              <span className={`text-[10px] uppercase font-black tracking-widest ${tone.text}`}>{co.name} • Role Deep Dive</span>
            </div>
            <h1 className="text-2xl font-bold text-slate-100">{role.name}</h1>
            <p className="text-slate-400 mt-1">{role.tagline}</p>
          </header>

          {role.assessment && (
            <section className="bg-slate-900 border-2 border-amber-700 rounded-xl p-5">
              <div className="flex items-center gap-2 mb-3">
                <Trophy size={16} className="text-amber-400" />
                <h2 className="font-bold text-slate-100">Assessment — {role.assessment.platform}</h2>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                {role.assessment.parts.map((p, i) => (
                  <div key={i} className="bg-amber-950/40 border border-amber-800 rounded p-3">
                    <div className="text-[10px] uppercase font-black text-amber-400 tracking-wider">{p.name}</div>
                    <div className="mt-1 font-bold text-slate-200">{p.q} • {p.t}</div>
                    <div className="text-xs text-slate-400 mt-1">{p.topics}</div>
                  </div>
                ))}
              </div>
              <div className="border-t border-slate-700 pt-3">
                <div className="text-[10px] uppercase font-black tracking-wider text-slate-500 mb-2">STAR Example</div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                  <div className="bg-slate-800 p-2 rounded border border-slate-700"><span className="font-bold text-slate-300">Situation:</span> <span className="text-slate-400">{role.assessment.starExample.situation}</span></div>
                  <div className="bg-slate-800 p-2 rounded border border-slate-700"><span className="font-bold text-slate-300">Task:</span> <span className="text-slate-400">{role.assessment.starExample.task}</span></div>
                  <div className="bg-slate-800 p-2 rounded border border-slate-700"><span className="font-bold text-slate-300">Action:</span> <span className="text-slate-400">{role.assessment.starExample.action}</span></div>
                  <div className="bg-emerald-950/40 p-2 rounded border border-emerald-800"><span className="font-bold text-emerald-300">Result:</span> <span className="text-slate-200">{role.assessment.starExample.result}</span></div>
                </div>
              </div>
            </section>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <section className="bg-slate-900 border border-slate-800 rounded-xl p-5">
              <div className="flex items-center gap-2 mb-3"><Clock size={14} className="text-slate-500" /><h2 className="font-bold text-slate-100">A Day in the Role</h2></div>
              <ul className="space-y-2">
                {role.daily.map((d, i) => (
                  <li key={i} className="flex items-start gap-2 text-sm text-slate-300">
                    <span className={`inline-flex w-5 h-5 rounded-full ${tone.bg} ${tone.text} text-[10px] font-black items-center justify-center flex-shrink-0 mt-0.5`}>{i+1}</span>
                    <span>{d}</span>
                  </li>
                ))}
              </ul>
            </section>
            <section className="bg-slate-900 border border-slate-800 rounded-xl p-5">
              <div className="flex items-center gap-2 mb-3"><Target size={14} className="text-slate-500" /><h2 className="font-bold text-slate-100">Core KPIs</h2></div>
              <div className="space-y-2">
                {role.kpis.map((k, i) => (
                  <div key={i} className="border-l-4 border-slate-700 pl-3 py-1">
                    <div className="font-bold text-sm text-slate-200">{k.name}</div>
                    <code className="text-[11px] text-slate-500 font-mono">{k.formula}</code>
                  </div>
                ))}
              </div>
            </section>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <section className="bg-slate-950 border border-orange-900 rounded-xl p-5">
              <div className="flex items-center gap-2 mb-3"><Database size={14} className="text-orange-400" /><h2 className="font-bold text-orange-400">SQL Patterns They Live In</h2></div>
              <ul className="space-y-2">
                {role.sqlPatterns.map((p, i) => (
                  <li key={i} className="flex items-start gap-2 text-xs">
                    <ChevronRight size={12} className="text-orange-400 mt-0.5 flex-shrink-0" />
                    <code className="font-mono text-orange-100 leading-relaxed">{p}</code>
                  </li>
                ))}
              </ul>
            </section>
            <section className="bg-emerald-950 border border-emerald-800 rounded-xl p-5">
              <div className="flex items-center gap-2 mb-3"><Bot size={14} className="text-emerald-400" /><h2 className="font-bold text-emerald-400">Python / pandas Patterns</h2></div>
              <ul className="space-y-2">
                {role.pythonPatterns.map((p, i) => (
                  <li key={i} className="flex items-start gap-2 text-xs">
                    <ChevronRight size={12} className="text-emerald-400 mt-0.5 flex-shrink-0" />
                    <code className="font-mono text-emerald-100 leading-relaxed">{p}</code>
                  </li>
                ))}
              </ul>
            </section>
          </div>
        </div>
      </main>
    </div>
  );
};

/* =========================================================
   ROOT
   ========================================================= */
function App() {
  const [mode, setMode] = useState('drill');
  return (
    <ErrorBoundary>
      <div className="flex flex-col h-screen bg-slate-950">
        <nav className="bg-slate-950 border-b border-slate-800 flex items-center px-4 h-12 flex-shrink-0">
          <div className="flex items-center mr-6">
            <div className="w-6 h-6 bg-gradient-to-br from-orange-500 to-rose-500 rounded flex items-center justify-center text-white font-bold text-[10px] mr-2">S</div>
            <span className="font-bold text-sm text-slate-100">SQL <span className="bg-gradient-to-r from-orange-400 to-rose-400 bg-clip-text text-transparent">Master</span></span>
          </div>
          <div className="flex space-x-1">
            {[
              { id:'drill',      label:'Speed Drill', icon:<Code size={14}/> },
              { id:'flashcards', label:'Flashcards',  icon:<BookOpen size={14}/> },
              { id:'roles',      label:'Role Guide',  icon:<Briefcase size={14}/> }
            ].map(t => (
              <button key={t.id} onClick={() => setMode(t.id)}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded text-xs font-medium ${mode === t.id ? 'bg-slate-800 text-slate-100' : 'text-slate-500 hover:bg-slate-900'}`}>
                {t.icon}<span>{t.label}</span>
              </button>
            ))}
          </div>
          <div className="ml-auto flex items-center gap-3 text-[10px] text-slate-500">
            <span className="flex items-center"><ShoppingBag size={11} className="mr-1 text-orange-400" /> Shopee</span>
            <span className="flex items-center"><Plane size={11} className="mr-1 text-rose-400" /> Agoda</span>
            <span className="flex items-center pl-2 border-l border-slate-800"><Bot size={11} className="mr-1 text-emerald-400" /> Python bot</span>
          </div>
        </nav>
        <div className="flex-1 overflow-hidden">
          {mode === 'drill'      && <DrillMode />}
          {mode === 'flashcards' && <FlashcardsMode />}
          {mode === 'roles'      && <RolesMode />}
        </div>
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
